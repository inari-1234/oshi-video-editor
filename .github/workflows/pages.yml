name: Stage 1 CI and GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency versions
        run: npm ls vite rollup esbuild
      - name: Test
        run: npm test
      - name: Typecheck
        timeout-minutes: 2
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Minimal Vite smoke build
        timeout-minutes: 1
        run: |
          rm -rf .vite-diag .vite-diag-dist
          mkdir -p .vite-diag
          echo '<!doctype html><html><body><script type="module" src="./main.ts"></script></body></html>' > .vite-diag/index.html
          echo 'console.log("vite-smoke-ok")' > .vite-diag/main.ts
          npx vite build .vite-diag --outDir ../.vite-diag-dist --emptyOutDir
      - name: Vite build
        timeout-minutes: 2
        env:
          DEBUG: vite:*
        run: npx vite build --debug
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
